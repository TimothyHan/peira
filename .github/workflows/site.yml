# Builds and publishes the showcase site (source: TimothyHan/peira-site) to this repo's
# GitHub Pages, so it serves at timothyhan.github.io/peira — the site lives in its own repo,
# but Pages belongs to the repo whose name is the URL.
# Trigger manually (workflow_dispatch) after site changes, or via repository_dispatch
# type "site-deploy".
name: site

on:
  workflow_dispatch:
  repository_dispatch:
    types: [site-deploy]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Two checkouts as SIBLINGS. Checking the tool out inside the site tree let Next's
      # type-check sweep tool/src/**/*.ts into the site's tsconfig (DOM libs, different rules)
      # and fail on code the tool's own tsc compiles clean. Nothing globs across ../.
      - uses: actions/checkout@v4
        with:
          repository: TimothyHan/peira-site
          path: site
      - uses: actions/checkout@v4
        with:
          path: tool
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            tool/package-lock.json
      # The metrics strip's "tests on the tool" number comes from actually running the suite,
      # never typed. A red suite refuses to publish a count — and prints the failing tests.
      - name: count the tool's tests from a real run
        working-directory: tool
        run: |
          npm ci
          out=$(npm test 2>&1) || {
            echo "the tool's suite is red — refusing to publish a count. Failing tests:"
            echo "$out" | grep -A 20 '^not ok' | head -120
            exit 1
          }
          n=$(echo "$out" | grep -oE '^# tests [0-9]+' | grep -oE '[0-9]+')
          test -n "$n" || { echo "could not find '# tests N' in the output"; exit 1; }
          echo "PEIRA_TEST_COUNT=$n" >> "$GITHUB_ENV"
          echo "tests on the tool: $n"
      - working-directory: site
        run: npm ci
      - working-directory: site
        run: npm run build   # prebuild reads PEIRA_TEST_COUNT
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
