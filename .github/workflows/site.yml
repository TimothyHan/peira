# Builds and publishes the showcase site (source: TimothyHan/peira-site) to this repo's
# GitHub Pages, so it serves at timothyhan.github.io/peira — the site lives in its own repo,
# but Pages belongs to the repo whose name is the URL.
# Trigger manually (workflow_dispatch) after site changes, or via repository_dispatch
# type "site-deploy".
name: site

on:
  workflow_dispatch:
  repository_dispatch:
    types: [site-deploy]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: TimothyHan/peira-site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
