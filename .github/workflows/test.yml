# Peira's own test suite across the platforms and Node versions users run it on. Zero LLM —
# the suite uses canned transports (PEIRA_CLAUDE_BIN), so CI needs no key and no session,
# exactly like the CI Peira asks its users to set up.
#
# The Node matrix covers what package.json's `engines` field claims (>=18) rather than only
# the version we happen to develop on: a floor nobody tests is a guess, not a contract.
name: test
# Branch pushes and PRs only: a release tag points at a SHA the branch push already tested, and
# the second matrix it used to trigger doubled the runner load for no information.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22, 24]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    # the suite runs in ~20s; anything approaching this is a hang, not slowness, and a hang
    # should fail fast rather than sit on a runner until the six-hour default
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
