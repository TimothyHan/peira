# Peira's own test suite across the platforms users run it on. Zero LLM — the suite uses
# canned transports (PEIRA_CLAUDE_BIN), so CI needs no key and no session, same as user CI.
name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
